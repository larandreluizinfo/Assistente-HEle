<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Helê — Assistente da Feira de Ciências</title>
  <link rel="stylesheet" href="css/estilos.css" />
</head>
<body>
  <header class="cabecalho">
    <h1>Helê</h1>
    <p>Assistente virtual da feira de ciências</p>
  </header>
  <main class="palco">
    <div id="avatar" class="avatar"></div>
    <div id="status" class="status">Carregando...</div>
    <div id="painel-fala" class="painel-fala" aria-live="polite">
      <p id="ouvido" class="ouvido"></p>
      <p id="fala"></p>
    </div>
    <button id="btn-falar" class="btn" type="button">Falar</button>
    <form id="form-texto" class="form-texto">
      <input id="entrada-texto" type="text" placeholder="Ou digite sua pergunta..." autocomplete="off" />
      <button class="btn" type="submit">Enviar</button>
    </form>
  </main>
  <footer class="rodape">
    <a href="admin.html">Editar conhecimento</a>
  </footer>
  <script src="js/config.js"></script>
  <script src="js/conhecimento.js"></script>
  <script src="js/voz.js"></script>
  <script src="js/avatar.js"></script>
  <script src="js/arduino.js"></script>
  <script src="js/assistente.js"></script>
</body>
</html>
