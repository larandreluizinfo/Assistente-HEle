<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Modo Treinamento — Helê</title>
  <link rel="stylesheet" href="css/estilos.css" />
</head>
<body>
  <header class="cabecalho">
    <h1>Modo Treinamento</h1>
    <p>A Helê pergunta, você responde e ela aprende</p>
  </header>
  <main class="painel">
    <fieldset>
      <legend>Conversa automática</legend>
      <p id="treino-pergunta" class="treino-pergunta">Clique em iniciar: começamos pela escola, professores e feira. Projetos por último.</p>
      <div id="treino-conversa" class="treino-conversa" aria-live="polite"></div>
      <p id="treino-progresso" class="treino-progresso"></p>
      <div class="acoes">
        <button type="button" id="btn-treino-iniciar" class="btn">Iniciar conversa</button>
        <button type="button" id="btn-treino-parar" class="btn btn-secundario">Parar</button>
        <button type="button" id="btn-treino-reset" class="btn btn-secundario">Resetar memória</button>
      </div>
      <form id="form-treino-texto" class="form-texto">
        <input id="treino-resposta" type="text" placeholder="Ou digite a resposta e dê Enter..." autocomplete="off" />
        <button class="btn" type="submit">Enviar</button>
      </form>
      <p id="treino-msg" class="msg"></p>
    </fieldset>
    <fieldset>
      <legend>Perguntas que ela não soube responder (<span id="pendentes-count">0</span>)</legend>
      <div id="lista-pendentes"></div>
    </fieldset>
  </main>
  <footer class="rodape">
    <a href="index.html">Assistente</a> · <a href="admin.html">Editar conhecimento</a>
  </footer>
  <script src="js/config.js"></script>
  <script src="js/conhecimento.js"></script>
  <script src="js/voz.js"></script>
  <script src="js/treino.js"></script>
</body>
</html>
